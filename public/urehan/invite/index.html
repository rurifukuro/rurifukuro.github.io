<!-- =========================================================
     このページは何か（2026-08-26 新設）

     アプリ内の「友達を招待」「アンケート回答後の紹介ポップアップ」から
     共有されるリンクの受け口。踏んだ人はここから App Store へ進む。

     ■ なぜポータル（/urehan/）へ直接送らないのか
       閲覧の記録（analytics.js → increment_blog_view）は
       **パスしか持たない**（`p_path: window.location.pathname`）。
       招待リンクを /urehan/ に向けると、紹介で来た人と
       広告・検索・X から来た人が**同じ1つの数字に混ざる**＝
       「紹介がどれだけ効いたか」が最初から測れない。
       受け口のパスを分ければ、サーバー側は何も足さずに
       開発者ダッシュボードのポータルアクセス画面でそのまま数えられる。
       /urehan は既に TRACK_PREFIXES に入っているので、
       このディレクトリを置いた時点で計測対象になる（allowlist の前方一致）。

     ■ 🔴 とれはんっ！の /torehan/invite/ と作りが違う（写して直さない）
       あちらは「紹介コード（8桁）を受け取ってアプリへ渡す」ための中継で、
       特典の成立条件を明記する義務がある。
       こちらは **レジさぽっ！に紹介報酬が無い**（2026-08-26 ユーザー確定）ので、
       ・紹介コードのカード
       ・特典（perk）ブロック
       ・torehan:// を叩き直す「アプリで開く」ボタン
       のいずれも**置かない**。
       🔴 ここに特典めいた文言を書き足さない＝報酬が無いのに書けば虚偽表示になる。

     ■ ct（App Store のキャンペーン計測）
       `?src=` が付いていればそれを使い、無ければ `referral` を入れる。
       アプリ側は導線ごとに src を分けて渡す（survey / info）＝
       どちらの導線から紹介が生まれたかを Apple 側でも分けて見られる。
       🔴 analytics.js は「既に ct が入っているリンクは触らない」ので、
          この inline script（defer より先に走る）で入れた値が必ず勝つ。
     ========================================================= -->

<style>

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px 18px;border-radius:14px;
    text-decoration:none;font-weight:700;font-size:16.5px;
    margin-bottom:12px;
  }
  .btn-store{background:#fff;color:var(--text)}
  .btn small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}

  .free{
    display:inline-block;margin-top:4px;font-size:13px;color:var(--sub);
  }
  .more{
    display:inline-block;margin-top:22px;font-size:14px;
    color:#fff;text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:2px;
  }
  .foot{margin-top:30px;font-size:12.5px;color:var(--sub)}
  .foot a{color:var(--sub)}
</style>
</head>

      p3:"<b>Ventes, bénéfices et dépenses se cumulent automatiquement</b> : la déclaration fiscale n'est plus un casse-tête.",

  function pickLang() {
    var tags = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || "ja"];
    for (var i = 0; i < tags.length; i++) {
      var low = String(tags[i] || "").toLowerCase();
      if (low.indexOf("ja") === 0) return "ja";
      if (low.indexOf("ko") === 0) return "ko";
      if (low.indexOf("fr") === 0) return "fr";
      if (low.indexOf("zh") === 0) {
        /* 繁体字は zh-TW / zh-HK / zh-MO / zh-Hant-* で来る */
        return /hant|tw|hk|mo/.test(low) ? "zh-Hant" : "zh";
      }
      if (low.indexOf("en") === 0) return "en";
    }
    return "ja";
  }
  var lang = pickLang();
  var d = L[lang] || L.ja;
  document.documentElement.lang = (lang === "zh-Hant") ? "zh-Hant" : lang;

  function setText(id, s) { var el = document.getElementById(id); if (el) el.textContent = s; }
  /* 定型文のみ（利用者由来の文字列は一切入らない）。 */
  function setHtml(id, s) { var el = document.getElementById(id); if (el) el.innerHTML = s; }
  /* ボタンのラベルは「主文＋<small>補足」の2段。textContent で主文を入れると
     small ごと消えるので、入れ直しまでを1つの関数にまとめる（片方だけ呼ぶ事故を作らない）。 */
  function setBtnLabel(id, main, sub) {
    var span = document.getElementById(id);
    if (!span) return;
    span.textContent = main;
    var small = document.createElement("small");
    small.textContent = sub;
    span.appendChild(small);
  }
  setText("t-title", d.title);
  setText("t-lead", d.lead);
  setText("t-pointstitle", d.pointstitle);
  setHtml("t-p1", d.p1);
  setHtml("t-p2", d.p2);
  setHtml("t-p3", d.p3);
  setBtnLabel("t-store", d.store, d.storesub);
  setBtnLabel("t-play", d.play, d.playsub);
  setText("t-free", d.free);
  setText("t-more", d.more);
  setText("t-privacy", d.privacy);

  /* ---- App Store のキャンペーン計測（R61・/torehan/invite/ と同じ作法） ----
     `?src=` があればそれを、無ければ `referral` を ct に入れる。
     analytics.js は ct 済みのリンクを触らないので、ここで入れた値が勝つ。 */
  (function () {
    var PT = "128997588";  /* 瑠璃フクロウ チーム共通のプロバイダID（全アプリ共通・固定値） */
    var src = "";
    try { src = new URLSearchParams(location.search).get("src") || ""; } catch (e) { src = ""; }
    /* analytics.js の sanitizeCt と同じ規則（英数字・_・- のみ／40文字）。
       規則を緩めない＝ct に使えない文字が混ざると Apple 側で黙って落ちる。 */
    var ct = String(src).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40) || "referral";

    var links = document.querySelectorAll('a[href*="apps.apple.com"]');
    for (var i = 0; i < links.length; i++) {
      var u;
      try { u = new URL(links[i].href); } catch (e) { continue; }
      if (u.searchParams.has("ct")) continue;
      u.searchParams.set("pt", PT);
      u.searchParams.set("ct", ct);
      u.searchParams.set("mt", "8");
      links[i].href = u.toString();
    }
  })();
})();
</script>
<script defer src="/analytics.js"></script>
