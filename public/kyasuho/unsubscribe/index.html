<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>お知らせの配信停止｜きゃすりん</title>
<style>
/* 🔴 既存の /unsubscribe/ は別プロジェクト（とれはんっ！／レジさぽっ！の Supabase）向け。
      きゃすりんは DB が別なので、同じページを使い回せない＝このページを分けている。
   色は目視で選ばず実測（DS24）: 本文 #2b2350 on #fff7f9 = 13.66:1 /
   補助 #4e4864 = 8.18:1 / 白文字ボタン #b3261e = 6.0:1。 */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  background:#fff7f9;color:#2b2350;min-height:100vh;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:52px 22px 60px}
.logo{font-size:22px;font-weight:800;text-align:center;letter-spacing:.04em}
.logo .dot{color:#ff5c8d}
h1{font-size:20px;font-weight:800;margin:26px 0 16px}
p{font-size:15px;color:#4e4864;margin-bottom:12px}
.card{background:#fff;border:1px solid #f3d9e2;border-radius:20px;padding:24px 22px}
button{
  display:block;width:100%;margin-top:18px;
  background:#b3261e;color:#fff;border:0;border-radius:14px;
  padding:16px 20px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
}
button:hover{background:#8f1e18}
button:disabled{opacity:.55;cursor:default}
.msg{font-size:14px;margin-top:16px;min-height:1px;font-weight:700}
.msg.is-ok{color:#0f7a4a}
.msg.is-err{color:#b3261e}
footer{
  text-align:center;font-size:12.5px;color:#4e4864;margin-top:36px;
  border-top:1px solid #f3d9e2;padding-top:20px;
}
footer a{color:#4e4864}
</style>
</head>
<body>
<div class="wrap">
  <p class="logo">きゃすりん<span class="dot">.</span></p>

  <h1>お知らせの配信停止</h1>

  <div class="card">
    <p id="lead">
      下のボタンを押すと、「きゃすりん」公開のお知らせの配信を停止します。
      以後、こちらからご案内をお送りすることはありません。
    </p>
    <button id="btn" type="button">配信を停止する</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </div>

  <footer>
    瑠璃フクロウ ｜ お問い合わせ：<a href="mailto:rurifukuro@gmail.com">rurifukuro@gmail.com</a><br>
    <a href="/kyasuho/">きゃすりんのご案内へ</a>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://rhmuitgbvilqwdevxxox.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJobXVpdGdidmlscXdkZXZ4eG94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMTg1NTIsImV4cCI6MjA5Nzc5NDU1Mn0.-AFsrYH8SSv0CddNq12eNcUEDsQtthDr-L6xNw8JNas";

  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");
  var lead = document.getElementById("lead");

  // メールクライアントのリンク先読みで勝手に解除されないよう、
  // GET で開いただけでは何もせず、必ずボタンを押してもらう。
  var token = new URLSearchParams(location.search).get("t") || "";
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function say(text, kind) {
    msg.textContent = text;
    msg.className = "msg is-" + kind;
  }

  if (!UUID_RE.test(token)) {
    btn.disabled = true;
    lead.textContent =
      "配信停止用のリンクが正しく読み取れませんでした。お手数ですが、お送りしたご案内のリンクをもう一度お開きください。";
    say("うまくいかない場合は rurifukuro@gmail.com までご連絡ください。折り返し停止いたします。", "err");
    return;
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    btn.textContent = "停止しています…";
    // ky_prelaunch_unsubscribe は存在しないトークンでも true を返す（列挙対策）。
    // ＝「停止しました」の表示は、そのトークンが実在したことを意味しない。
    fetch(SUPABASE_URL + "/rest/v1/rpc/ky_prelaunch_unsubscribe", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ p_token: token })
    })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        btn.style.display = "none";
        lead.textContent = "配信を停止しました。";
        say("ご登録いただき、ありがとうございました。", "ok");
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = "配信を停止する";
        say(
          "うまく停止できませんでした。時間をおいてお試しいただくか、rurifukuro@gmail.com までご連絡ください。折り返し停止いたします。",
          "err"
        );
      });
  });
})();
</script>
</body>
</html>
