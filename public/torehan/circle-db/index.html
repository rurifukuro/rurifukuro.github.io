<!-- =========================================================
     ウェブ版サークルDB（2026-11-08 新設・とれはんっ！ Rev841）

     アプリの「サークルDB」（サーバーの master_circles）をウェブで探し・足し・アプリへ取り込むページ。
     ユーザー指示（2026-11-08・逐語）:
       「とれはんっ！にあるサークルDBの機能をウェブ版で公開したい」
       「このウェブ版は先ほどの地図ルートウェブ版と同じサイト上で公開する／またとれはんっ！に取り込みボタンは大きめにしておいて」
       「ウェブ版も無料で同機能を使えるようにする」（＝𝕏 まとめて検索）
       「サークルの追加ボタンを必ず画面上に配置しておいてね、イメージで言うとサークルにチェック入れてない時は、サークルを追加ボタンを表示してるイメージ」
       「アプリ版のサーバーと共通で追加されたサークルは登録と、検索できるようにしてね」

     ■ アプリと揃えているもの（CONFIG-PAIR＝片方だけ直すと食い違う）
       ・読み込み   … `searchMasterCircles`（RemoteSyncBackend）と同じ＝updated_at の新しい順に 1000 件を引き、
                       名前・サークル主・𝕏 ID の小文字の部分一致で絞る。
       ・登録       … `registerMasterCircle` と同じ「trim→同名×同サークル主を select→無ければ insert／23505 は引き直し」。
                       ⚠ 既にある行は **空いている 𝕏 ID を補うだけ**（Claude 案・アプリは上書き）。ウェブは誰でも匿名で叩けるので、
                       アプリ利用者が入れた値をウェブから書き換えられないようにした。修正はアプリの編集から。
       ・文字数上限 … 0049/0050 の `mc_update` と同じ（サークル名 100／サークル主 60／𝕏 ID 60→ウェブは 15 文字の ID だけ）。
       ・NG ワード  … アプリ `src/config/contentFilter.ts` の BANNED_WORDS を **生成で写す**（下の GENERATED 区画・手で直さない）。
                       同期: とれはんっ！リポジトリで `npm run sync:web-ngwords`／検査: `npm run check:web-ngwords`。
       ・𝕏 まとめて検索 … `src/utils/bulkXSearch.ts` と同じ（20 件ずつ・from:a OR from:b・語は日本語のまま）。
       ・取り込み上限 … アプリ `CircleDbImportLinkListener.tsx` の `CIRCLE_DB_IMPORT_MAX` と同じ 30 件。
       ・通報       … アプリと同じお問い合わせフォーム（src/config/contact.ts の CONTACT_FORM_URL）。

     ■ 取り込みの経路（リンクに載せるのは ID だけ＝アプリはサーバーから引き直して、名前を見せて確認してから入れる）
       ・スマホ … `torehan://circledb?ids=<32桁>,…` を本人のタップで開く。開かなかったらストアへの案内を出す。
       ・PC     … 同じ ID を載せた https の中継 URL（このページの `?import=`）を QR で出す。
       ・中継   … `?import=` で来たら一覧の代わりに「とれはんっ！で開く」とストアの案内を出す（読み込み時に自動で飛ばさない）。

     ⚠ サーバーの値は**一切 innerHTML に入れない**（textContent と URL エンコードのみ）。
     ⚠ 𝕏 へのリンクは ID が /^[A-Za-z0-9_]{1,15}$/ を満たすときだけ ID から作る。twitter_profile_url はリンクにしない（2026-08-18 決定）。
     ⚠ キーは公開用（publishable / anon）。analytics.js・waitlist.js と同じ値。service_role は絶対に置かない。
     ========================================================= -->

<style>
  :root{
    --navy:#0c1a38; --navy2:#142c54; --card:#18315c; --line:rgba(255,255,255,.14);
    --orange:#f5821f; --orange2:#ff9a3d; --text:#e4ebf7; --sub:#b8c7e6; --faint:#9fb0d4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Meiryo",sans-serif;
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%) fixed;background-color:var(--navy);color:var(--text);
    min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  a{color:inherit}
  button{font-family:inherit}
  [hidden]{display:none !important}
  header{border-bottom:1px solid var(--line);background:rgba(12,26,56,.9);position:sticky;top:0;z-index:5;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .hd img{width:40px;height:40px;border-radius:10px;background:#fff;flex:none}
  .hd .ttl{font-weight:800;font-size:18px;line-height:1.35;min-width:0}
  .hd .ttl small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
  .hd .app{margin-left:auto;flex:none;font-size:13px;color:var(--sub);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  main{max-width:1180px;margin:0 auto;padding:18px 16px}
  .search input{width:100%;font-size:17px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.08);color:#fff;outline:none;-webkit-appearance:none;appearance:none}
  .search input:focus{border-color:var(--orange2)}
  .search input::placeholder{color:var(--faint)}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
  .tools .lbl{font-size:13px;color:var(--sub);margin-right:2px}
  .chip{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
  .chip.on{background:#fff;color:var(--navy);font-weight:700;border-color:#fff}
  .chip.x{border-color:rgba(255,255,255,.35);font-weight:700}
  .chip:disabled{opacity:.45;cursor:default}
  .count{margin-left:auto;font-size:13px;color:var(--sub)}
  .note{font-size:12px;color:var(--faint);margin:4px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:620px){.grid{grid-template-columns:1fr}.hd .app{display:none}.count{margin-left:0;flex-basis:100%}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer}
  .card.sel{outline:3px solid var(--orange);outline-offset:-1px}
  .card.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 4px var(--orange2)}100%{box-shadow:0 0 0 0 transparent}}
  .name{font-size:18px;font-weight:800;padding-right:44px;line-height:1.4;word-break:break-word}
  .owner{font-size:14px;color:var(--sub);word-break:break-word}
  .owner b{color:var(--text);font-weight:600}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .lk{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:rgba(255,255,255,.05)}
  .lk:hover{border-color:rgba(255,255,255,.4)}
  .check{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;border:2px solid var(--faint);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--navy);background:transparent;cursor:pointer}
  .card.sel .check{background:var(--orange);border-color:var(--orange)}
  .imp{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;
    border:none;border-radius:14px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;text-decoration:none;
    background:linear-gradient(180deg,var(--orange2),var(--orange));box-shadow:0 6px 18px rgba(245,130,31,.35)}
  .imp .ic{font-size:22px}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
  .foot button{font-size:12px;color:var(--faint);background:none;border:none;text-decoration:underline;cursor:pointer;padding:4px 0 4px 8px}
  .state{text-align:center;color:var(--sub);padding:36px 12px;font-size:15px}
  .state button{margin-top:12px}
  .more{display:block;margin:18px auto 0;font-size:15px;padding:12px 26px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,20,44,.97);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  .bar .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
  .bar .n{font-size:15px;white-space:nowrap}
  .bar .n b{font-size:22px;color:var(--orange2)}
  .bar .clr{font-size:13px;color:var(--sub);background:none;border:none;text-decoration:underline;cursor:pointer;white-space:nowrap}
  .bar .imp{width:auto;flex:1;max-width:520px;margin-left:auto;min-height:64px;font-size:19px}
  .bar .add{flex:1;max-width:520px;margin-left:auto;min-height:64px;font-size:19px;font-weight:800;border-radius:14px;cursor:pointer;
    color:var(--navy);background:#fff;border:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .bar .hint{font-size:13px;color:var(--sub)}
  @media (max-width:620px){.bar .in{flex-wrap:wrap;gap:8px 14px}.bar .imp,.bar .add{max-width:none;flex-basis:100%;font-size:17px}
    .bar .long,.bar .hint{display:none}.links .lk{padding:5px 8px;font-size:12px}}
  @media (min-width:621px){.bar .short{display:none}}
  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#1b2438;
    font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:20;max-width:calc(100% - 32px);text-align:center}
  /* ダイアログ（白地） */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
  .dlg{background:#fff;color:#1b2438;border-radius:18px;max-width:460px;width:100%;padding:24px 22px;position:relative;max-height:calc(100vh - 32px);overflow:auto}
  .dlg h2{font-size:19px;margin-bottom:6px;padding-right:28px}
  .dlg p{font-size:14px;color:#4a5670}
  .dlg .x{position:absolute;top:8px;right:10px;width:36px;height:36px;font-size:22px;background:none;border:none;color:#5c667a;cursor:pointer}
  .dlg .qr{display:block;width:260px;height:260px;margin:14px auto;border:1px solid #dde3ef;border-radius:8px}
  .dlg ul{list-style:none;font-size:13px;background:#f3f6fb;border-radius:10px;padding:10px 14px;margin-top:8px}
  .dlg li{padding:2px 0;word-break:break-word}
  .dlg .sm{font-size:12px;color:#5c667a;margin-top:10px}
  .dlg .row{display:flex;gap:10px;margin-top:16px}
  .dlg .row > *{flex:1}
  .btn2{min-height:48px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid #c9d2e3;background:#fff;color:#1b2438;text-decoration:none;
    display:flex;align-items:center;justify-content:center;padding:0 12px;text-align:center}
  .btn2.pri{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn2:disabled{opacity:.5;cursor:default}
  .fld{margin-top:14px}
  .fld label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
  .fld label .req{color:#c2410c;font-weight:700;margin-left:6px;font-size:12px}
  .fld input{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #c9d2e3;color:#1b2438;background:#fff}
  .fld input:focus{outline:2px solid var(--orange);border-color:var(--orange)}
  .fld .err{font-size:12px;color:#b91c1c;margin-top:4px}
  .fld .fh{font-size:12px;color:#5c667a;margin-top:4px}
  .fld .fh.ok{color:#15803d;font-weight:700}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .words{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .words button{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid #c9d2e3;background:#fff;color:#1b2438;cursor:pointer}
  .words button.on{background:#1b2438;color:#fff;border-color:#1b2438}
  .chunks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  /* 中継（?import=） */
  .relay{max-width:520px;margin:0 auto;padding:28px 6px 40px;text-align:center}
  .relay .icon{width:88px;height:88px;border-radius:20px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.35);margin-bottom:14px}
  .relay h1{font-size:22px;line-height:1.5}
  .relay .lead{font-size:15px;color:var(--sub);margin-top:8px}
  .relay ul{list-style:none;text-align:left;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:18px 0;font-size:14px}
  .relay li{padding:3px 0;word-break:break-word}
  .relay .imp{min-height:64px;font-size:19px;margin-top:6px}
  .relay .stores{display:flex;gap:10px;margin-top:14px}
  .relay .stores a{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.06)}
  .relay .sm{font-size:12px;color:var(--faint);margin-top:14px}
  .relay .back{display:inline-block;margin-top:22px;font-size:14px;color:var(--sub)}
  footer{max-width:1180px;margin:30px auto 0;padding:0 16px;font-size:12px;color:var(--faint);text-align:center}
  footer a{color:var(--sub);margin:0 8px}
</style>
</head>

<header><div class="hd">
  <img src="/icon.png" alt="">
  <div class="ttl"><span id="t_title">とれはんっ！ サークルDB</span><small id="t_tag">みんなで育てるサークル台帳を、ウェブで探して取り込めます</small></div>
  <a class="app" id="t_getapp" href="/torehan/">アプリを入手</a>
</div></header>

<!-- ── 一覧 ── -->
<main id="list">
  <div class="search"><input type="search" id="q" autocomplete="off" enterkeyhint="search" maxlength="100" placeholder="サークル名・サークル主・𝕏 の ID で探す"></div>

    <span class="lbl" id="t_sort">並び替え</span>

  <div class="state" id="state"></div>
  <button class="more" id="more" type="button" hidden></button>

<!-- ── 中継（?import=） ── -->
<main id="relay" hidden>
  <div class="relay">
    <img class="icon" src="/icon.png" alt="">

    <ul id="r_names" hidden></ul>

</footer>

<!-- ── 下のバー（何も選んでいない＝サークルを追加／選んでいる＝取り込み） ── -->
<div class="bar" id="bar"><div class="in">

  <p id="openBody"></p>
  <div class="row">
    <a class="btn2" href="https://apps.apple.com/jp/app/id6776913607" target="_blank" rel="noopener">App Store</a>
    <a class="btn2" href="https://play.google.com/store/apps/details?id=com.torehan.app" target="_blank" rel="noopener">Google Play</a>

<!-- ── サークルを追加 ── -->

  <button class="x" type="button" data-close aria-label="閉じる">×</button>

    <div class="fld"><label for="fName"><span id="l_name"></span><span class="req" id="l_req"></span></label>

    <div class="err" id="eAdd" hidden></div>

  function pickLang() {

      if (low.indexOf('ja') === 0) return 'ja';
      if (low.indexOf('ko') === 0) return 'ko';
      if (low.indexOf('fr') === 0) return 'fr';
      if (low.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(low) ? 'zh-Hant' : 'zh';
      if (low.indexOf('en') === 0) return 'en';
    }
    return 'ja';
  }

  /* 🔴 Rev842: 𝕏 のプロフィール URL から ID を取り出す。**アプリ src/utils/twitterId.ts の extractTwitterId と

     取り出せない／予約パスなら null（＝入力欄はそのまま残し、登録時に cleanXId がエラーを出す）。 */
  var X_RESERVED = ['home', 'explore', 'notifications', 'messages', 'i', 'search'];
  function extractXId(url) {
    var m = String(url == null ? '' : url).match(/(?:https?:\/\/)?(?:x\.com|twitter\.com)\/([a-zA-Z0-9_]+)/i);
    if (!m) return null;
    if (X_RESERVED.indexOf(m[1].toLowerCase()) >= 0) return null;
    return m[1];
  }
  function cleanXId(v) {
    var s = String(v == null ? '' : v).trim();
    var got = extractXId(s);

    return X_ID_RE.test(s) ? s : '';

  }

  function runRelay(raw) {

    });
    var open = $('r_open');
    if (!ids.length) {
      setText('r_lead', tr('rBad')); open.hidden = true; return;

    /* 読み込み時に自動で torehan:// へ飛ばさない（未インストール端末では OS のエラーだけが出る）＝本人のタップを起点にする */

      if (!found.length) { setText('r_lead', tr('rNone')); open.hidden = true; return; }
      setText('r_lead', tr('rLead', { n: found.length }));
      open.href = appLink(found);
      var ul = $('r_names'); ul.textContent = '';
      found.forEach(function (h) {
        var li = document.createElement('li');
        var r = byId[h];
        li.textContent = '・' + r.circle_name + (r.illustrator_name ? '（' + r.illustrator_name + '）' : '');
        ul.appendChild(li);
      });
      ul.hidden = false;
      var miss = ids.length - found.length;
      if (miss > 0) { setText('r_missing', tr('rMissing', { n: miss })); $('r_missing').hidden = false; }
    }).catch(function () {
      /* 名前が引けなくてもアプリ側で引き直すので、開く導線は残す */
      setText('r_lead', tr('rLead', { n: ids.length }));
    });
  }

  /* ================= 一覧 ================= */
  var all = [];          /* {id, name, owner, x, upd} */
  var shown = [];        /* 絞り込み・並び替え後 */
  var limit = PAGE_SIZE;
  var sortMode = 'kana';
  var selected = [];     /* 選んだ順の id */
  var collator = (typeof Intl !== 'undefined' && Intl.Collator) ? new Intl.Collator('ja') : null;

  function load(focusName) {
    var st = $('state');
    st.textContent = tr('loading'); st.hidden = false;
    var url = SB + '/rest/v1/master_circles?select=id,circle_name,illustrator_name,twitter_id,updated_at&order=updated_at.desc&limit=' + FETCH_LIMIT;
    return fetch(url, { headers: sbHeaders() }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (rows) {
      all = (rows || []).filter(function (r) { return r && r.id && String(r.circle_name || '').trim(); }).map(function (r) {
        return { id: String(r.id), name: String(r.circle_name).trim(), owner: String(r.illustrator_name || '').trim(),
          x: cleanXId(r.twitter_id), upd: Number(r.updated_at) || 0 };
      });
      var ids = {};
      all.forEach(function (c) { ids[c.id] = 1; });
      selected = selected.filter(function (id) { return ids[id]; });
      if (focusName) $('q').value = focusName;
      render();
    }).catch(function () {
      st.textContent = '';
      var p = document.createElement('div'); p.textContent = tr('loadErr');
      var b = document.createElement('button'); b.className = 'more'; b.type = 'button'; b.textContent = tr('retry');
      b.addEventListener('click', function () { load(); });
      st.appendChild(p); st.appendChild(b); st.hidden = false;
      $('grid').textContent = ''; $('more').hidden = true; $('count').textContent = '';
    });
  }

  function applyFilter() {
    var q = $('q').value.trim().toLowerCase();
    shown = !q ? all.slice() : all.filter(function (c) {
      return c.name.toLowerCase().indexOf(q) !== -1 || c.owner.toLowerCase().indexOf(q) !== -1 || c.x.toLowerCase().indexOf(q) !== -1;
    });
    if (sortMode === 'kana') {
      shown.sort(function (a, b) { return collator ? collator.compare(a.name, b.name) : (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
    } else {
      shown.sort(function (a, b) { return b.upd - a.upd; });
    }
  }

  function fmtDate(ms) {
    if (!ms) return '';
    try { return new Date(ms).toLocaleDateString(lang, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
    catch (e) { return new Date(ms).toISOString().slice(0, 10); }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function cardFor(c) {
    var d = el('div', 'card' + (selected.indexOf(c.id) !== -1 ? ' sel' : ''));
    d.dataset.id = c.id;
    var chk = el('button', 'check', selected.indexOf(c.id) !== -1 ? '✓' : '');
    chk.type = 'button';
    chk.setAttribute('aria-pressed', selected.indexOf(c.id) !== -1 ? 'true' : 'false');
    chk.setAttribute('aria-label', tr('check') + ': ' + c.name);
    chk.addEventListener('click', function (e) { e.stopPropagation(); toggle(c.id); });
    d.appendChild(chk);
    d.appendChild(el('div', 'name', c.name));
    if (c.owner) d.appendChild(el('div', 'owner', tr('ownerBy', { o: c.owner })));
    if (c.x) {
      var links = el('div', 'links');
      var a = el('a', 'lk', '𝕏 @' + c.x);
      a.href = 'https://x.com/' + encodeURIComponent(c.x); a.target = '_blank'; a.rel = 'noopener nofollow';
      links.appendChild(a);
      WORDS.forEach(function (w) {
        if (!w[1]) return;
        var s = el('a', 'lk', '🔍 ' + w[1]);
        s.href = xSearchUrl([c.x], w[1], false); s.target = '_blank'; s.rel = 'noopener nofollow';
        links.appendChild(s);
      });
      d.appendChild(links);
    }
    var imp = el('button', 'imp');
    imp.type = 'button';
    imp.appendChild(el('span', 'ic', '📲'));
    imp.appendChild(document.createTextNode(tr('imp')));
    imp.addEventListener('click', function (e) { e.stopPropagation(); startImport([c.id]); });
    d.appendChild(imp);
    var foot = el('div', 'foot');
    foot.appendChild(el('span', '', c.upd ? tr('updated', { d: fmtDate(c.upd) }) : ''));
    var rep = el('button', '', tr('report'));
    rep.type = 'button';
    rep.addEventListener('click', function (e) { e.stopPropagation(); setText('repBody', tr('repBody', { name: c.name })); $('repGo').href = CONTACT_FORM_URL; showOv('repOv'); });
    foot.appendChild(rep);
    d.appendChild(foot);
    /* カードのどこを押しても選択を切り替える（リンクとボタンは除く） */
    d.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a,button')) return;
      toggle(c.id);
    });
    return d;
  }

  function render() {
    applyFilter();
    var g = $('grid');
    g.textContent = '';
    var frag = document.createDocumentFragment();
    shown.slice(0, limit).forEach(function (c) { frag.appendChild(cardFor(c)); });
    g.appendChild(frag);
    var st = $('state');
    st.textContent = '';
    if (!shown.length) { st.textContent = all.length ? tr('empty') : tr('none0'); st.hidden = false; } else st.hidden = true;
    var rest = shown.length - limit;
    var more = $('more');
    if (rest > 0) { more.textContent = tr('more', { n: rest }); more.hidden = false; } else more.hidden = true;
    setText('count', tr('count', { total: all.length, n: shown.length }));
    renderBar();
  }

  function toggle(id) {
    var i = selected.indexOf(id);
    if (i !== -1) selected.splice(i, 1);
    else {
      if (selected.length >= IMPORT_MAX) { toast(tr('max', { max: IMPORT_MAX })); return; }
      selected.push(id);
    }
    var card = document.querySelector('.card[data-id="' + id.replace(/[^A-Za-z0-9_]/g, '') + '"]');
    if (card) {
      var on = selected.indexOf(id) !== -1;
      card.classList.toggle('sel', on);
      var chk = card.querySelector('.check');
      chk.textContent = on ? '✓' : '';
      chk.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    renderBar();
  }

  function bulkIds() {
    var src = selected.length
      ? selected.map(function (id) { return all.filter(function (c) { return c.id === id; })[0]; }).filter(Boolean)
      : shown;
    var seen = {}, out = [];
    src.forEach(function (c) {
      if (!c.x) return;
      var k = c.x.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1; out.push(c.x);
    });
    return out;
  }

  function renderBar() {
    var n = selected.length;
    $('barAdd').hidden = n > 0;
    $('barSel').hidden = n === 0;
    if (n > 0) {
      setCountHtml($('selN'), 'selN', n);
      setText('impLong', tr('impLong', { n: n }));
      setText('impShort', tr('impShort', { n: n }));
    }
    var bx = $('bulkx');
    var cnt = bulkIds().length;
    bx.textContent = tr('bxBtn', { n: cnt });
    bx.disabled = cnt === 0;
  }

  /* ---- 取り込み ---- */
  function namesOf(ids) {
    return ids.map(function (id) { return all.filter(function (c) { return c.id === id; })[0]; }).filter(Boolean);
  }
  var qrLoaded = null;
  function loadQr() {
    if (window.QRCore) return Promise.resolve();
    if (qrLoaded) return qrLoaded;
    qrLoaded = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = '/torehan/circle-db/qrcore.js'; s.onload = function () { res(); }; s.onerror = function () { qrLoaded = null; rej(new Error('qr')); };
      document.head.appendChild(s);
    });
    return qrLoaded;
  }
  function drawQr(text) {
    var svg = $('qrSvg');
    var q = window.QRCore.create(text, { errorCorrectionLevel: 'L' });
    var size = q.modules.size, m = 4, path = '';
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) {
      if (q.modules.get(r, c)) path += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
    }
    var full = size + m * 2;
    svg.setAttribute('viewBox', '0 0 ' + full + ' ' + full);
    svg.innerHTML = '<rect width="' + full + '" height="' + full + '" fill="#fff"/><path fill="#0c1a38" d="' + path + '"/>';
  }
  var currentRelay = '';
  function startImport(ids) {
    ids = ids.slice(0, IMPORT_MAX);
    if (!ids.length) return;
    if (isMobile()) {
      /* 本人のタップでアプリを開く。1.6 秒たってもページが前面のままなら、開かなかったとみなしてストアを案内する */
      var t0 = Date.now();
      var timer = setTimeout(function () {
        if (!document.hidden && Date.now() - t0 < 4000) showOv('openOv');
      }, 1600);
      var cancel = function () { if (document.hidden) clearTimeout(timer); };
      document.addEventListener('visibilitychange', cancel, { once: true });
      window.addEventListener('pagehide', function () { clearTimeout(timer); }, { once: true });
      location.href = appLink(ids);
      return;
    }
    currentRelay = relayLink(ids);
    var list = namesOf(ids);
    setText('qrBody', tr('qrBody', { n: list.length }));
    var ul = $('qrNames'); ul.textContent = '';
    list.slice(0, 8).forEach(function (c) { ul.appendChild(el('li', '', '・' + c.name + (c.owner ? '（' + c.owner + '）' : ''))); });
    if (list.length > 8) ul.appendChild(el('li', '', '…'));
    setText('qrCopy', tr('copy'));
    $('qrSvg').innerHTML = '';
    showOv('qrOv');
    loadQr().then(function () { drawQr(currentRelay); }).catch(function () { /* QR が出せなくてもリンクのコピーは使える */ });
  }
  $('qrCopy').addEventListener('click', function () {
    var done = function () { setText('qrCopy', tr('copied')); setTimeout(function () { setText('qrCopy', tr('copy')); }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentRelay).then(done, function () {});
    } else {
      var ta = document.createElement('textarea'); ta.value = currentRelay; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* 何もしない */ }
      document.body.removeChild(ta);
    }
  });
  $('impSel').addEventListener('click', function () { startImport(selected.slice()); });
  $('clr').addEventListener('click', function () { selected = []; render(); });

  /* ---- 𝕏 まとめて検索（全員無料・アプリと同じ作り） ---- */
  var bxWord = 'none';
  function renderBx() {
    var ids = bulkIds();
    setText('bxNote', tr(selected.length ? 'bxNoteSel' : 'bxNoteAll', { n: ids.length, size: BULK_X_CHUNK }));
    var wv = $('bxWords'); wv.textContent = '';
    WORDS.forEach(function (w) {
      var b = el('button', w[0] === bxWord ? 'on' : '', w[1] || tr('bxNone'));
      b.type = 'button';
      b.addEventListener('click', function () { bxWord = w[0]; renderBx(); });
      wv.appendChild(b);
    });
    var word = '';
    WORDS.forEach(function (w) { if (w[0] === bxWord) word = w[1]; });
    var ch = $('bxChunks'); ch.textContent = '';
    if (!ids.length) { ch.appendChild(el('p', 'sm', tr('bxEmpty'))); return; }
    for (var i = 0; i < ids.length; i += BULK_X_CHUNK) {
      var part = ids.slice(i, i + BULK_X_CHUNK);
      var a = el('a', 'btn2 pri', ids.length <= BULK_X_CHUNK ? tr('bxOne') : tr('bxChunk', { from: i + 1, to: i + part.length }));
      a.href = xSearchUrl(part, word, true); a.target = '_blank'; a.rel = 'noopener nofollow';
      ch.appendChild(a);
    }
  }
  $('bulkx').addEventListener('click', function () { renderBx(); showOv('bxOv'); });

  /* ---- サークルを追加（アプリ registerMasterCircle と同じ手順・既存行は空いている 𝕏 ID を補うだけ） ---- */
  var lastAdd = 0;
  $('addBtn').addEventListener('click', function () {
    $('addForm').reset();
    ['eName', 'eX', 'eAdd'].forEach(function (id) { $(id).hidden = true; });
    resetXHint();
    $('fName').value = $('q').value.trim().slice(0, MAX_NAME);
    showOv('addOv');
    setTimeout(function () { $('fName').focus(); }, 30);
  });
  function showErr(id, msg) { var e = $(id); e.textContent = msg; e.hidden = !msg; }
  function resetXHint() { var h = $('hX'); h.textContent = tr('xHint'); h.className = 'fh'; }
  $('fX').addEventListener('input', function () {
    var el = $('fX');
    var got = extractXId(el.value);
    if (!got) { resetXHint(); return; } /* URL でなくなったら「取り出しました」を残さない */
    el.value = got;
    var h = $('hX'); h.textContent = tr('xGot', { id: got }); h.className = 'fh ok';
    showErr('eX', '');
  });
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    showErr('eName', ''); showErr('eX', ''); showErr('eAdd', '');
    if ($('fWeb').value) { hideOv(); return; } /* 自動投稿の罠（人には見えない欄） */
    var name = $('fName').value.trim().slice(0, MAX_NAME);
    var owner = $('fOwner').value.trim().slice(0, MAX_OWNER);
    var xRaw = $('fX').value.trim();
    var x = cleanXId(xRaw);
    if (!name) { showErr('eName', tr('errName')); $('fName').focus(); return; }
    if (xRaw && !x) { showErr('eX', tr('errX')); $('fX').focus(); return; }
    if (hasNgWord(name) || hasNgWord(owner) || hasNgWord(x)) { showErr('eAdd', tr('ngBody')); return; }
    if (Date.now() - lastAdd < 8000) { showErr('eAdd', tr('wait')); return; }
    var btn = $('addSubmit');
    btn.disabled = true;
    register(name, owner, x).then(function (res) {
      lastAdd = Date.now();
      hideOv();
      toast(tr(res.kind, { name: name }));
      return load(name).then(function () { flash(res.id); });
    }).catch(function () {
      showErr('eAdd', tr('addErr'));
    }).then(function () { btn.disabled = false; });
  });
  function findExisting(name, owner) {
    var url = SB + '/rest/v1/master_circles?select=id,twitter_id&circle_name=eq.' + encodeURIComponent(name) +
      '&illustrator_name=eq.' + encodeURIComponent(owner) + '&limit=2';
    return fetch(url, { headers: sbHeaders() }).then(function (r) {
      if (!r.ok) throw new Error('select ' + r.status);
      return r.json();
    }).then(function (rows) { return rows && rows[0] ? rows[0] : null; });
  }
  function fillOrKeep(row, x) {
    if (!x || cleanXId(row.twitter_id)) return Promise.resolve({ kind: 'exists', id: row.id });
    return fetch(SB + '/rest/v1/rpc/mc_update', {
      method: 'POST', headers: sbHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ p_id: row.id, p_patch: { twitter_id: x, twitter_profile_url: 'https://x.com/' + x } })
    }).then(function (r) {
      if (!r.ok) throw new Error('mc_update ' + r.status);
      return { kind: 'filledX', id: row.id };
    });
  }
  function register(name, owner, x) {
    return findExisting(name, owner).then(function (row) {
      if (row) return fillOrKeep(row, x);
      return fetch(SB + '/rest/v1/master_circles?select=id', {
        method: 'POST',
        headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify({ circle_name: name, illustrator_name: owner, twitter_id: x,
          twitter_profile_url: x ? 'https://x.com/' + x : '', updated_at: Date.now() })
      }).then(function (r) {
        if (r.ok) return r.json().then(function (rows) { return { kind: 'added', id: rows && rows[0] ? rows[0].id : '' }; });
        /* 23505＝同時に他の人が同じサークルを作った → 引き直して既存として扱う（アプリと同じ） */
        return r.json().catch(function () { return {}; }).then(function (body) {
          if (r.status === 409 || (body && body.code === '23505')) {
            return findExisting(name, owner).then(function (row2) {
              if (!row2) throw new Error('dup but missing');
              return fillOrKeep(row2, x);
            });
          }
          throw new Error('insert ' + r.status);
        });
      });
    });
  }
  function flash(id) {
    if (!id) return;
    var card = document.querySelector('.card[data-id="' + String(id).replace(/[^A-Za-z0-9_]/g, '') + '"]');
    if (!card) return;
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  }

  /* ---- 検索・並び替え・もっと見る ---- */
  var qTimer = 0;
  $('q').addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(function () { limit = PAGE_SIZE; render(); }, 150); });
  function setSort(mode) {
    sortMode = mode;
    $('sortKana').classList.toggle('on', mode === 'kana');
    $('sortNew').classList.toggle('on', mode === 'new');
    limit = PAGE_SIZE; render();
  }
  $('sortKana').addEventListener('click', function () { setSort('kana'); });
  $('sortNew').addEventListener('click', function () { setSort('new'); });
  $('more').addEventListener('click', function () { limit += PAGE_SIZE; render(); });

  renderBar();
  load();
})();
</script>
<script defer src="/analytics.js"></script>
</body>
</html>
