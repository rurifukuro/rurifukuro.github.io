<!-- =========================================================
     このページは何か（2026-08-25 新設・RF-G2）

     アプリ内の「友達を招待」から共有されるリンクの受け口。
     共有本文へ `torehan://` を直接貼るとリンク化されない（Android で実被弾・
     詳細は /torehan/join/ の同じ注記）ので、https でここを踏ませて
     ここから `torehan://invite?ref=……` を叩き直す。

     グループ招待（/torehan/join/）とは目的が違う:
       ・join   … 当日の買い物を仲間と分担するグループへ入る（招待コード = 6桁）
       ・invite … 友達紹介プログラム（紹介コード = 8桁）
     受け口を分けているのは、コードの体系も、成立の条件も、
     アプリ側で開く画面も別物だから（片方に寄せると必ずどちらかが嘘になる）。

     ⚠ 読み込み時に自動で torehan:// へ飛ばさない。
       アプリ未インストール端末では OS のエラーダイアログが出るだけで、
       「壊れているページ」に見える＝必ず本人のタップを起点にする。
     ⚠ code はページ内で一切 innerHTML に入れない（textContent と URL エンコードのみ）。
     ⚠ 特典の条件はここに**明記する**（ユーザー指示 2026-08-25＝
       「紹介報酬の条件は明確に紹介ポップアップなどに記載する事」）。
       アプリ内のポップアップと**同じ3条件**を書く＝片方だけ直すと食い違う。
     ========================================================= -->

  function pickLang() {
    var tags = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || "ja"];
    for (var i = 0; i < tags.length; i++) {
      var tag = String(tags[i] || "");
      var low = tag.toLowerCase();
      if (low.indexOf("ja") === 0) return "ja";
      if (low.indexOf("ko") === 0) return "ko";
      if (low.indexOf("fr") === 0) return "fr";
      if (low.indexOf("zh") === 0) {
        /* 繁体字は zh-TW / zh-HK / zh-MO / zh-Hant-* で来る */
        return /hant|tw|hk|mo/.test(low) ? "zh-Hant" : "zh";
      }
      if (low.indexOf("en") === 0) return "en";
    }
    return "ja";
  }
  var lang = pickLang();
  var d = L[lang] || L.ja;
  document.documentElement.lang = (lang === "zh-Hant") ? "zh-Hant" : lang;

  function setText(id, s) { var el = document.getElementById(id); if (el) el.textContent = s; }
  /* 定型文のみ（利用者由来の文字列は一切入らない）。 */
  function setHtml(id, s) { var el = document.getElementById(id); if (el) el.innerHTML = s; }

  function setBtnLabel(id, main, sub) {

  /* ---- 紹介コードの取り出し ----
     サーバー（migration 0106 get_or_create_referral_code）は
     23456789ABCDEFGHJKLMNPQRSTUVWXYZ × 8桁で発行する
     （紛らわしい 0/O/1/I を含まない集合）。
     大文字化・空白/ゼロ幅の除去・全角→半角だけ行い、
     文字集合の外は落とさない（黙って消すと別のコードになりうる）。
     ⚠ 桁数を 8 に決め打ちしないのは、将来サーバー側が桁を伸ばしたときに
        **このページだけが黙って弾く**状態を作らないため（4〜16 で受ける）。 */
  var raw = "";
  try { raw = new URLSearchParams(location.search).get("ref") || ""; } catch (e) { raw = ""; }
  var code = raw
    .replace(/[\u200b\u200c\u200d\ufeff]/g, "")
    .replace(/[\s\u3000]/g, "")
    .replace(/[\uff10-\uff19\uff21-\uff3a\uff41-\uff5a]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
    })
    .toUpperCase();
  if (!/^[A-Z0-9]{4,16}$/.test(code)) code = "";

  var hint = document.getElementById("t-hint");
  if (code) {
    document.getElementById("code").textContent = code;
    document.getElementById("codecard").hidden = false;
    document.getElementById("perk").hidden = false;
    var open = document.getElementById("open");
    open.href = "torehan://invite?ref=" + encodeURIComponent(code);
    open.hidden = false;
    hint.innerHTML = d.hint;   /* 定型文のみ（code は入らない） */

    /* クリック数の記録は analytics.js（＝Supabase の鍵を持つ唯一のファイル）に任せる。
       ここでは「正規化済みのコード」を渡すだけ＝鍵も fetch もこのページには置かない。
       analytics.js は defer なので、この行のほうが必ず先に走る。 */
    window.__TOREHAN_REFERRAL_CODE__ = code;
  } else {
    hint.textContent = d.nocode;
    /* コードが無いときは特典ブロックも出さない
       ＝受け取れない相手に条件だけ読ませない（＝問い合わせの元になる）。 */
  }

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    var done = function () {
      btn.textContent = d.copied;
      setTimeout(function () { btn.textContent = d.copy; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {});
      return;
    }
    var ta = document.createElement("textarea");
    ta.value = code; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  });

  (function () {
    var PT = "128997588";  /* 瑠璃フクロウ チーム共通のプロバイダID（全アプリ共通・固定値） */
    var links = document.querySelectorAll('a[href*="apps.apple.com"]');
    for (var i = 0; i < links.length; i++) {
      var u;
      try { u = new URL(links[i].href); } catch (e) { continue; }
      if (u.searchParams.has("ct")) continue;
      u.searchParams.set("pt", PT);
      u.searchParams.set("ct", "referral");
      u.searchParams.set("mt", "8");
      links[i].href = u.toString();
    }
  })();
})();
</script>
<script defer src="/analytics.js"></script>
